AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CostPulse - /cost Slack slash command reporting AWS spend by service.

Parameters:
  AllowedChannelIds:
    Type: String
    Description: Comma-separated Slack channel IDs where /cost is allowed. Empty rejects everything.
    Default: ""
  AlertEmail:
    Type: String
    Description: Email that receives the budget alert and the invocation-spike alarm.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  MonthlyBudgetUsd:
    Type: Number
    Description: Account-wide monthly cost budget in USD.
    Default: 5
    MinValue: 1

Resources:
  CostPulseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: costpulse
      CodeUri: src/
      Handler: costpulse.app.handler
      Runtime: python3.14
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt CostPulseRole.Arn
      LoggingConfig:
        LogGroup: !Ref CostPulseLogGroup
      Environment:
        Variables:
          ALLOWED_CHANNEL_IDS: !Ref AllowedChannelIds
          SIGNING_SECRET_PARAM: /costpulse/slack-signing-secret
          BOT_TOKEN_PARAM: /costpulse/slack-bot-token
      FunctionUrlConfig:
        AuthType: NONE

  CostPulseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/costpulse
      RetentionInDays: 14

  # Explicit role instead of SAM policy templates, so AWSLambdaBasicExecutionRole
  # (logs on every log group) is never attached.
  CostPulseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: costpulse-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCosts
                Effect: Allow
                Action: ce:GetCostAndUsage
                # Cost Explorer does not support resource-level permissions.
                Resource: "*"
              - Sid: ReadSlackSecrets
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/costpulse/slack-signing-secret
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/costpulse/slack-bot-token
              - Sid: LazyListenerSelfInvoke
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:costpulse
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/costpulse:*

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: costpulse-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # The Function URL has no rate limiting; this flags a flood within minutes.
  InvocationSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: costpulse-invocation-spike
      AlarmDescription: More than 1,000 CostPulse invocations in 5 minutes. Kill switch is in the README.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref CostPulseFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: costpulse-account-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  RequestUrl:
    Description: Paste into the Slack app's /cost slash command Request URL.
    Value: !GetAtt CostPulseFunctionUrl.FunctionUrl
